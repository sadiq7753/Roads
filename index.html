<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Long Way Round — Road Trip Log</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="header">
    <div class="title-block">
      <h1>The Long Way Round</h1>
      <span class="subtitle">a road trip, logged</span>
    </div>
    <div class="stat-row">
      <div>STOPS <b id="statStops">–</b></div>
      <div>MILES DRIVEN <b id="statMiles">–</b></div>
      <div>DAYS <b id="statDays">–</b></div>
    </div>
  </div>

  <div class="app-body">
    <div class="sidebar">
      <h2>Route Log</h2>
      <div id="stopList"></div>
    </div>

    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map-app.js"></script>
</body>
</html>
